version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: emai-postgres
    environment:
      POSTGRES_USER: emai
      POSTGRES_PASSWORD: emai123
      POSTGRES_DB: emai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emai -d emai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
